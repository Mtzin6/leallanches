<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leal Lanches — Administração</title><link rel="stylesheet" href="styles.css"></head><body class="admin-body"><div id="login" class="login-wrap"><div class="login-card"><a class="login-logo" href="index.html" aria-label="Voltar para Leal Lanches"><img src="logo-leal-lanches.png" alt="Leal Lanches"></a><span class="eyebrow">ÁREA RESTRITA</span><h1>Acesso administrativo</h1><p>Entre para gerenciar os produtos do Leal Lanches.</p><label>E-mail<input id="email" type="email" placeholder="seu@email.com"></label><label>Senha<input id="password" type="password" placeholder="••••••••"></label><button class="btn primary full" id="loginBtn" type="button">Entrar no painel</button><div id="loginMsg" class="msg"></div><a class="back" href="index.html">← Voltar para o site</a></div></div>
<div id="dashboard" class="dashboard hidden"><header class="admin-header"><a class="brand" href="index.html" aria-label="Leal Lanches"><img class="brand-logo admin-brand-logo" src="logo-leal-lanches.png" alt="Leal Lanches"></a><button id="logout" class="btn ghost" type="button">Sair</button></header><main class="admin-main"><div class="section-head"><div><span class="eyebrow">PAINEL</span><h2>Gerencie seu <em>cardápio</em></h2></div><button class="btn primary" id="addProduct" type="button">+ Novo produto</button></div><div class="admin-note">💡 Esta versão é uma demonstração local. Para publicar e sincronizar em todos os celulares, conecte o projeto a um banco como Supabase.</div><div id="adminProducts" class="admin-products"></div></main></div>
<div class="modal hidden" id="modal"><div class="modal-card"><button class="modal-close" id="modalClose" type="button">×</button><span class="eyebrow">PRODUTO</span><h2 id="modalTitle">Novo produto</h2><label>Nome<input id="pName"></label><label>Preço<input id="pPrice" type="number" step=".01" min="0"></label><label>Categoria<select id="pCat"><option>Hambúrgueres</option><option>Pastéis</option><option>Bebidas</option><option>Combos</option></select></label><label>Descrição<textarea id="pDesc"></textarea></label><label>Foto do produto<input id="pImageFile" type="file" accept="image/*"><span class="file-help">No celular abre a galeria; no computador abre os arquivos do dispositivo.</span></label><div id="imagePreview" class="image-preview hidden"><img id="previewImg" alt="Pré-visualização da foto"></div><div class="modal-actions"><button class="btn ghost" id="cancel" type="button">Cancelar</button><button class="btn primary" id="save" type="button">Salvar produto</button></div></div></div><script src="admin.js"></script></body></html>
